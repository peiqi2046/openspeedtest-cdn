name = "openspeedtest-cdn"
main = "worker.js"
compatibility_date = "2026-05-26"

[vars]
UUID = "54945a08-1de9-453e-bd51-8f2dbff976ad"
PROXYIP = "104.18.35.115"

# For sensitive values, prefer `wrangler secret put` over [vars]:
#   wrangler secret put UUID
#   wrangler secret put PROXYIP

[triggers]
crons = ["*/3 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[placement]
host = "fnnas.nadav.com.cn:5666"
